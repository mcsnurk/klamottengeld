<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Klamottengeld</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Familienbudget</div>
        <h1>Klamottengeld</h1>
      </div>
    </header>

    <main>
      <section id="configScreen" class="card hidden">
        <h2>App noch nicht verbunden</h2>
        <p>Die Verbindung zu Supabase konnte noch nicht hergestellt werden.</p>
      </section>

      <section id="appScreen" class="hidden">
        <div class="toolbar card compact">
          <div>
            <div class="muted small">Gemeinsamer Bereich</div>
            <strong id="householdTitle">Klamottengeld</strong>
            <div id="lastUpdated" class="muted update-time">Noch nicht aktualisiert</div>
          </div>
          <button id="refreshBtn" type="button" class="ghost refresh-btn" aria-label="Daten aktualisieren">↻ Aktualisieren</button>
        </div>

        <div class="quarter-nav">
          <button id="prevQuarter" class="icon-btn" aria-label="Vorheriges Quartal">‹</button>
          <div>
            <div class="muted small">Ausgewähltes Quartal</div>
            <strong id="quarterLabel">Q4 2026</strong>
          </div>
          <button id="nextQuarter" class="icon-btn" aria-label="Nächstes Quartal">›</button>
        </div>

        <div id="budgetCards" class="budget-grid"></div>

        <button id="addPurchaseBtn" class="fab">＋ Einkauf eintragen</button>

        <section class="section-head">
          <div>
            <h2>Einkäufe</h2>
            <p class="muted small">Antippen zum Bearbeiten</p>
          </div>
        </section>
        <div id="purchaseList" class="purchase-list"></div>
      </section>
    </main>
  </div>

  <dialog id="purchaseDialog">
    <form id="purchaseForm" method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">Buchung</div>
          <h2 id="purchaseDialogTitle">Einkauf eintragen</h2>
        </div>
        <button type="button" class="icon-btn" data-close-dialog>×</button>
      </div>

      <input id="purchaseId" type="hidden" />

      <div class="form-grid">
        <label>Datum<input id="purchaseDate" type="date" required /></label>
        <label>Geschäft<input id="merchant" maxlength="120" placeholder="z. B. Zalando" /></label>
        <label class="wide">Bestell-/Rechnungsnummer<input id="invoiceNumber" maxlength="120" /></label>
      </div>

      <div class="items-head">
        <h3>Positionen</h3>
        <button id="addItemBtn" type="button" class="ghost">＋ Position</button>
      </div>

      <div id="itemsContainer" class="items"></div>

      <label>Notiz<textarea id="notes" rows="2" maxlength="500"></textarea></label>

      <div class="dialog-actions">
        <button id="deletePurchaseBtn" type="button" class="danger hidden">Löschen</button>
        <div class="spacer"></div>
        <button type="button" class="ghost" data-close-dialog>Abbrechen</button>
        <button type="submit" class="primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
